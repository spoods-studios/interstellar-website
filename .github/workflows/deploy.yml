name: Deploy to GitHub Pages
on:
  push:
    branches: [main]   # D-08: no path filters, every push deploys
  workflow_dispatch:

# Serialize deploys (starter-workflow shape): without this, an older run's
# deploy-pages can finish after a newer run's, leaving the live site stale
# while the stale run stays green and the fresh run's probe turns red.
# cancel-in-progress stays false so every queued push still deploys, in order.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci --ignore-scripts
      - run: env -u GITHUB_SHA npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    # D-67: a deploy that never reaches the live site turns the workflow red unattended
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Probe live site for freshness and key routes
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SHA: ${{ github.sha }}
        run: bash tests/live-probe.sh "$PAGE_URL" "$SHA"
