# The GitHub mirror lane. ONE workflow, TWO jobs, and the gate is the `needs:` edge between them.
#
# WHY ONE WORKFLOW RATHER THAN TWO. Forgejo has no `workflow_run` event. A second workflow written
# to watch the first never fires AND never errors -- the failure presents as "the mirror just
# never happened", which is indistinguishable from a mirror that was never installed at all. A
# `needs:` edge is a scheduling fact the runner enforces before it starts anything, so there is no
# poll to race, no re-run to mis-read, and a tag whose verification failed leaves no trace on
# github.com because the mirror job never starts rather than starting and erroring.
#
# WHY NOT FORGEJO'S NATIVE PUSH-MIRROR. It can filter branches but not tags, and it publishes
# every ref. `interstellar-engine` alone carries dozens of `brain/*` and `gsd/*` session branches;
# the native feature would put all of them on a public host on a timer, which is the exact
# inversion of D-02. This lane pushes EXACTLY TWO REFS and never more.
#
# Action references are fully-qualified URLs on purpose: a bare `actions/checkout@v5` resolves
# against an instance-wide default actions URL that an admin can change. They are ALSO pinned to an
# immutable full commit SHA, under the same rule (S-21) the GitHub lane applies: the URL fixes
# WHERE the action resolves from, the SHA fixes WHAT it resolves to, and only both together stop a
# moved upstream tag from executing on this runner beside the mirror PAT.
#
# The mirror credential is the organisation-level Actions secret `MIRROR_GITHUB_PAT`. It is NOT
# named `GITHUB_MIRROR_PAT`: Forgejo reserves the whole `GITHUB_` and `GITEA_` prefixes for
# Actions secret names and rejects a create with `400 invalid secret name`. The host file that
# holds the value still keys it as GITHUB_MIRROR_PAT; only the forge-side name is constrained.
#
# WHAT "VERIFIED" MEANS IN THIS REPOSITORY, AND WHAT IT DOES NOT. This repository DOES have a
# build system. It tracks `astro.config.mjs`, `tsconfig.json`, `package-lock.json`, `src/`,
# `tests/`, and a `package.json` carrying `"build": "astro build"` and
# `"test": "bash tests/run-all.sh"`. The verify job below runs NONE of it: verification here is
# a full-depth checkout, the release-vocabulary guard and an ancestry assertion, and that is all.
# An earlier revision of this header said "there is no build system here". That was false, and
# it was load-bearing -- it read as the justification for not running one.
#
# THE GAP IS ACCEPTED RISK, RECORDED RATHER THAN PAPERED OVER, and the reason is the runner. The
# `linux-engine` label binds to an immutable C++/Vulkan toolchain image that ships Node v20.19.2
# and NO npm (corepack only), while `astro@7.0.9` declares `engines.node >= 22.12.0`. So
# `npm ci && npm run build && npm test` cannot run on this runner at all. Making it run means
# rebuilding the runner's toolchain image, which is an infrastructure change and not this file's
# to make.
#
# WHAT THAT COSTS, STATED PLAINLY. This is the one repository of the twelve that mirrors EVERY
# push to `main` (the `site-push-mirror` exception, argued at the trigger below), and GitHub's
# `.github/workflows/deploy.yml` publishes GitHub Pages on every such push with no path filter.
# A commit that does not compile under Astro, or that compiles but fails `tests/run-all.sh`,
# therefore reaches the live public site's deploy pipeline unbuilt and untested. The failure
# surfaces on github.com AFTER the content has left this box, not here before it does.
#
# WHAT THE FIX LOOKS LIKE WHEN THE RUNNER CAN CARRY IT: a SEPARATE validation job that is
# deliberately NOT in the mirror job's `needs:`. It must be able to report red without
# withholding the publication the `site-push-mirror` exception exists to guarantee; putting the
# build in `verify` instead would convert an accepted operator policy into a blocking gate,
# which is a different decision from the one this file records.
#
# `interstellar-engine` is the one repository of the twelve whose verify job runs a real build
# and test suite.

name: Release mirror

on:
  push:
    # THE ONE NAMED EXCEPTION among the twelve, decided at Plan 07's checkpoint
    # (`site-push-mirror`) and recorded against FORGE-05 in REQUIREMENTS.md. This repository
    # additionally mirrors EVERY push to `main`, so its GitHub-Pages `deploy.yml` keeps
    # publishing at exactly the cadence it does today.
    #
    # The numbers are the argument: 230 commits to `main` in the last 90 days against exactly
    # ONE tag in this repository's entire history. Tag-gated publishing here would be a
    # silent-staleness failure mode -- a frozen public site is indistinguishable from a site
    # with no new content -- and `workflow_dispatch` does not rescue it, because a manual
    # dispatch still builds from whatever commit GitHub already holds. Content that never
    # mirrored cannot be published by dispatching it.
    #
    # `deploy.yml` is NOT ported and NOT modified. It stays on GitHub and GitHub keeps running
    # it; it cannot run here, because Forgejo has no Pages target, no equivalent deploy action
    # and no GitHub OIDC issuer. This file existing is also what stops it double-running on the
    # forge -- but read the next paragraph before relying on that, because the rule is narrower
    # than it reads.
    #
    # SHADOWING IS PER-REF, NOT PER-REPOSITORY. Forgejo's workflow resolution walks
    # `.forgejo/workflows`, `.gitea/workflows`, `.github/workflows` and stops at the first that
    # exists -- and it evaluates that against THE TREE OF THE PUSHED COMMIT, not against the
    # repository. A branch whose tree carries no `.forgejo/` falls through to
    # `.github/workflows/`, and the forge enqueues those jobs, including any `runs-on:
    # ubuntu-latest` or `windows-latest` that a runner registered with one label
    # (`linux-engine`) can never service. Such a job does not fail; it sits "waiting for a
    # runner" and accumulates one permanently-pending run per push. So the guarantee holds for
    # refs that carry this directory and for no others, and branching from a ref that predates
    # it reintroduces the fallthrough silently.
    branches:
      - main
    tags:
      - 'v*'

jobs:
  verify:
    # The one label this runner registered.
    runs-on: linux-engine
    outputs:
      # Consumed by the mirror job's `if:`. Fail-closed: it defaults to false and the mirror runs
      # only on the literal string `true`, so a gate step that fails to write its output BLOCKS
      # the mirror rather than opening it.
      qualifies: ${{ steps.gate.outputs.qualifies }}
    steps:
      - name: Check out at full depth
        # S-21: immutable SHA pin. A mutable @v5 tag can silently move to new code, and that code
        # would run on this self-hosted runner in the same workspace as the mirror PAT. Re-resolve with:
        #   git ls-remote https://data.forgejo.org/actions/checkout refs/tags/v5
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # Full depth on purpose, in BOTH jobs. The mirror job pushes a tag object and
          # fast-forwards GitHub's `main`; a shallow clone silently cannot do either, and the
          # failure reads like a permissions problem rather than like a truncated clone.
          fetch-depth: 0

      - name: Gate on the release tag vocabulary
        id: gate
        # THE TAG VOCABULARY GUARD, and the reason it exists here rather than in the trigger.
        # The vocabulary decided at Plan 01's checkpoint is release-only: `v<major>.<minor>` and
        # `v<major>.<minor>.<patch>` qualify, and every suffixed form -- `-gate-passed`,
        # `-review-draft` -- is excluded, because D-12 fast-forwards GitHub's `main` to the
        # tagged commit and a draft tag would move the public front page to a deliberately
        # unfinished state.
        #
        # That exclusion CANNOT be expressed in the `on.push.tags` glob above. Forgejo's tag
        # globs are shell-style and `*` matches hyphens, so `v*.*.*` matches
        # `v1.2.0-gate-passed` exactly as happily as it matches `v1.2.0`. A tighter-looking glob
        # does not help; only a guard does, and this is it.
        #
        # READ THIS BEFORE CONCLUDING THE MIRROR IS BROKEN. When this guard excludes a tag, the
        # mirror job is SKIPPED -- and a skipped job looks IDENTICAL in the Actions list to a run
        # that never triggered at all. That ambiguity is the accepted cost of the release-only
        # vocabulary, recorded when it was chosen. If a tag you expected on GitHub is not there,
        # read this step's output first: silence here is the designed outcome, not a fault.
        run: |
          set -eu
          qualifies=false
          case "${GITHUB_REF}" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              if printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
                qualifies=true
                echo "release vocabulary: tag $tag QUALIFIES"
              else
                echo "release vocabulary: tag $tag is EXCLUDED as a suffixed form"
                echo "the mirror job will be SKIPPED -- this is the guard working, not a failure"
              fi
              ;;
            refs/heads/main)
              qualifies=true
              echo "push to main: QUALIFIES under the site-push-mirror exception"
              ;;
            *)
              echo "neither a tag nor main -- the mirror job will be SKIPPED"
              ;;
          esac
          echo "qualifies=$qualifies" >> "$GITHUB_OUTPUT"

      - name: Assert the commit is on the default branch
        if: steps.gate.outputs.qualifies == 'true'
        # NOT filler. The mirror job fast-forwards GitHub's `main` to this commit, which is only
        # a genuine fast-forward if this commit is already reachable from `main` here. This is
        # the precondition D-12's second push depends on, and asserting it locally is what stops
        # it being discovered as a rejected push against a public host.
        #
        # The fetch is explicit rather than trusted to the checkout: on a tag push the checked-out
        # ref is the tag, and whether `refs/remotes/origin/main` also materialises is an
        # implementation detail of the action rather than a guarantee.
        run: |
          set -eu
          # Peeled the same way the mirror job peels it, so both jobs name the SAME object. On
          # an annotated or signed tag, HEAD and ${GITHUB_SHA} are different objects; asserting
          # the ancestry of one while pushing the other is exactly how a verified commit stops
          # being the published one.
          sha=$(git rev-parse --verify "HEAD^{commit}")
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          echo "$sha is reachable from origin/main -- the fast-forward is legitimate"

  mirror:
    # THE GATE, and it is a scheduling fact rather than a check. `needs: verify` means the runner
    # will not start this job at all unless the verify job finished green, so "verified" in
    # FORGE-05 is mechanically enforced rather than asserted.
    needs: verify
    if: needs.verify.outputs.qualifies == 'true'
    runs-on: linux-engine
    steps:
      - name: Check out at full depth
        # S-21: immutable SHA pin. A mutable @v5 tag can silently move to new code, and that code
        # would run on this self-hosted runner in the same workspace as the mirror PAT. Re-resolve with:
        #   git ls-remote https://data.forgejo.org/actions/checkout refs/tags/v5
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0

      - name: Push the verified ref to GitHub and fast-forward its main
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_GITHUB_PAT }}
        # EXACTLY TWO REFS leave this box: the tag (when the trigger was a tag), and a
        # fast-forward of `main`. There is no push of every ref and no forced push anywhere in
        # this file -- the sibling repositories carry dozens of `brain/*` and `gsd/*` session
        # branches and the homeserver repository's planning content, none of which belongs on a
        # public host, and no GitHub-side ref that existed before this lane may ever be moved
        # backwards or removed by it.
        #
        # THE CREDENTIAL-BEARING URL IS ASSEMBLED INSIDE THE COMMAND THAT CONSUMES IT. It is
        # never assigned to a variable that is later printed, never echoed, and deliberately
        # never handed to `git remote add`, which would persist it into `.git/config` where a
        # later step could read it. Embedding the registered secret VERBATIM is also what keeps
        # Forgejo's log masking effective: masking matches the literal value, so any scheme that
        # transforms it -- base64, splitting it across variables -- is what defeats the mask.
        run: |
          set -eu
          # WHY NOT ${GITHUB_SHA}. On a tag push Forgejo derives `github.sha` from the payload's
          # `after` field, which is the new value of the REF -- and for an ANNOTATED or signed
          # tag that is the tag OBJECT, not the commit it points at. A branch ref must resolve
          # to a commit, so pushing it into refs/heads/main is rejected outright, and rejected
          # only AFTER the tag itself has already been published to the public repository. The
          # live mirror proof (05-07) used a lightweight tag, where the tag ref value and the
          # commit are the same object, so it never exercised this. Peel explicitly instead,
          # and peel the same object the verify job asserted the ancestry of.
          sha=$(git rev-parse --verify "HEAD^{commit}")
          # ONE ATOMIC PUSH, NOT TWO. Two invocations publish the tag first and fast-forward
          # `main` second, so any failure between them -- a transient fault reaching github.com,
          # a GitHub `main` that has diverged, the tag-object rejection above -- leaves a
          # release tag on the public repository whose commit is not on `main`. There is no
          # rollback: `set -eu` aborts with the tag already published, and a re-run re-attempts
          # the same failing second push forever. `--atomic` makes the remote apply both ref
          # updates in one transaction or neither.
          case "${GITHUB_REF}" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              git push --atomic "https://x-access-token:${MIRROR_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
                "refs/tags/${tag}" "${sha}:refs/heads/main"
              echo "pushed tag ${tag} and fast-forwarded github main to ${sha}"
              ;;
            *)
              git push "https://x-access-token:${MIRROR_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
                "${sha}:refs/heads/main"
              echo "fast-forwarded github main to ${sha}"
              ;;
          esac
