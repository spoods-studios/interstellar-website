name: Test
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: linux-engine
    timeout-minutes: 15
    container:
      image: docker.io/library/node:22-bookworm@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
    steps:
      - uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends libxml2-utils
      - run: npm ci --ignore-scripts
      - run: env -u GITHUB_SHA npm test
